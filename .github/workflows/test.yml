name: Tests

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - run: python -m pytest -q
